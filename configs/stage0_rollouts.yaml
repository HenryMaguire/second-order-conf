# Stage 0 rollouts: Qwen3.5-2B instruct, frozen template, n = 32 at temperature 0.7 everywhere.
# Launch on the L4 VM (after approval) in 1,000-question batches: scripts/gcp/stage0_batch.sh N.
# Or all at once with:
#   scripts/gcp/supervise.sh stage0 rollouts-qwen35-2b-v1 -- \
#     uv run --extra gpu python -m soc.rollouts.run configs/stage0_rollouts.yaml
run_id: rollouts-qwen35-2b-v1
model: Qwen/Qwen3.5-2B   # post-trained (instruct) model; Qwen/Qwen3.5-2B-Base is the base
splits: [bigmath_train, bigmath_val, bigmath_test, gpqa_diamond, triviaqa, simpleqa]
n: 32
temperature: 0.7
max_new_tokens: 2048
seed: 0
shard_size: 250
# Thinking off: the template emits an empty <think></think>, and the model reasons briefly in
# plain text before <answer> (PLAN.md decision 6).
chat_template_kwargs: {enable_thinking: false}
vllm:
  revision: 15852e8c16360a2fea060d615a32b45270f8a8fc   # pinned 2026-10-21
  max_model_len: 4096
  gpu_memory_utilization: 0.9
wandb_project: null   # W&B off for now; run.json still records config, commit and seed
